name: Sync ProjectReLink upstream

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'ffffffuck/ProjectReLink-GyroRumble'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/pixl27/ProjectReLink.git
          git fetch upstream main

      - name: Check for upstream changes
        id: changes
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream is already included in main." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has new commits to sync." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare sync branch and check custom patch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C automation/upstream-sync
          if ! git merge --no-edit upstream/main; then
            echo "::error title=Upstream merge conflict::Resolve the upstream conflicts before syncing."
            exit 1
          fi
          if ! git apply --check --ignore-space-change --ignore-whitespace ProjectReLink-GyroRumble.patch; then
            echo "::error title=Gyro-rumble patch conflict::The upstream changes overlap the custom patch. Update the patch before merging."
            exit 1
          fi
          echo "Upstream merged and the gyro-rumble patch still applies." >> "$GITHUB_STEP_SUMMARY"

      - name: Push sync branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          git fetch origin automation/upstream-sync || true
          git push --force-with-lease origin automation/upstream-sync

      - name: Open or update sync pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Sync ProjectReLink upstream"
          body="The upstream main branch has new commits. The gyro-rumble patch check passed. This PR is merged automatically only after the Windows package and Vulkan build checks pass. A GyroRumble Fix release is published after the merge."
          number=$(gh pr list --base main --head automation/upstream-sync --state open --json number --jq '.[0].number // ""')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --base main --head automation/upstream-sync --title "$title" --body "$body"
            number=$(gh pr list --base main --head automation/upstream-sync --state open --json number --jq '.[0].number // ""')
          fi

          if [[ -z "$number" ]]; then
            echo "::error::Could not find the upstream sync pull request after creating it."
            exit 1
          fi

          echo "Waiting for the Windows package and Vulkan checks on PR #$number." >> "$GITHUB_STEP_SUMMARY"
          gh pr checks "$number" --watch --fail-fast

          state=$(gh pr view "$number" --json state --jq '.state')
          if [[ "$state" == OPEN ]]; then
            gh pr merge "$number" --merge
          elif [[ "$state" != MERGED ]]; then
            echo "::error::Sync PR #$number is in unexpected state: $state."
            exit 1
          fi

          merge_sha=$(gh pr view "$number" --json mergeCommit --jq '.mergeCommit.oid')
          if [[ -z "$merge_sha" || "$merge_sha" == null ]]; then
            echo "::error::Could not find the merge commit for sync PR #$number."
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=publish-upstream-sync \
            -F "client_payload[merge_sha]=$merge_sha"
          echo "PR #$number merged at $merge_sha; dispatched the release build." >> "$GITHUB_STEP_SUMMARY"
